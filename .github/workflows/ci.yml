name: CI

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Runtime migrations
        run: python scripts/migrate_runtime.py
      - name: Run tests with coverage
        run: pytest tests/ --cov --cov-report=term-missing
      - name: CLI smoke checks
        run: |
          python scripts/ingest_graph.py --help
          python scripts/review_workflow.py --help
          python scripts/evaluate_entity_resolution.py --help
          python scripts/run_jobs.py --help
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend test dependencies
        working-directory: web
        run: npm ci
      - name: Run frontend tests
        working-directory: web
        run: npx vitest run
