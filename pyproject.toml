[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "packgraph-lab"
version = "0.2.0"
description = "Local-first packaging intelligence workspace with graph, ingest, review, and entity-resolution tooling."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "pydantic==2.11.7",
  "neo4j==5.28.2",
  "python-dotenv==1.1.1",
  "python-multipart==0.0.20",
  "httpx==0.28.1",
  "google-adk>=2.3,<3",
]

[project.scripts]
packgraph-ingest = "scripts.ingest_graph:cli_main"
packgraph-er-eval = "scripts.evaluate_entity_resolution:main"
packgraph-review = "scripts.review_workflow:main"
packgraph-status = "scripts.status_dashboard:main"
packgraph-graph-schema = "scripts.migrate_graph_schema:main"

[tool.setuptools.packages.find]
include = ["app*", "agents*", "adk_architecture*", "scripts*"]
